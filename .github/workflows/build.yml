name: Build Mocap EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mss pyaudiowpatch imageio-ffmpeg pillow arabic-reshaper python-bidi windows-capture

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile --windowed --icon="mocap.ico" --add-data "mocap_logo.png;." --add-data "mocap.ico;." --collect-all imageio_ffmpeg --collect-all windows_capture --name "Mocap" ali_recorder.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: dist/Mocap.exe
